name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the Rust engine
        working-directory: engine-rs
        run: cargo build --release
      - name: Python tests
        run: |
          pip install -e ".[dev]"
          pytest -q
      - name: Browser engine agrees with the Rust engine
        run: web/tests/run_engine_check.sh
